      <!-- Library Section -->
      <section id="library" class="fade-in">

        <!-- Mobile Thought Stream (visible only on mobile) -->

        <!-- Bookshelf -->

            <div id="book-shelves" class="media-filters" role="group" aria-label="Filter books by shelf"></div>

            <p class="loading-state">Loading books...</p>
          </div>

        <!-- Media Library -->

          <div id="media-tabs" class="media-tabs" role="group" aria-label="Collections"></div>

          <ul id="media-list" class="media-list"></ul>
          <button id="media-more" class="library-more" hidden></button>
        </div>
</section>
    </main>

    <footer>
      <div class="footer-place">
        Vancouver, BC <span aria-hidden="true">·</span>

    <!-- Search Toggle Button -->
    <button
      id="search-toggle"
      class="search-toggle-btn"
      aria-label="Search"
      title="Search (⌘K)"
    >
      <span class="search-icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
      </span>
    </button>

    <!-- Theme Toggle Button -->
    <button
      id="theme-toggle"
      class="theme-toggle-btn"
      aria-label="Toggle dark mode"
      title="Toggle theme"
    >
      <span class="theme-icon" aria-hidden="true"></span>
    </button>

    <!-- Search Modal -->
    <div
      id="search-modal"
      class="search-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="search-input"
      hidden
    >
      <div class="search-backdrop"></div>
      <div class="search-container">
        <div class="search-input-wrapper">
          <span class="search-input-icon">🔍</span>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search for projects, writing..."
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            aria-label="Search"
          />
        </div>
        <div id="search-results" class="search-results"></div>
        <div class="search-footer">
          <span>↑↓ Navigate</span>
          <span>↵ Select</span>
          <span>ESC Close</span>
        </div>
      </div>
    </div>

    <!-- Script to populate mobile thoughts -->
    <script>
      // Populate mobile thought stream on mobile devices
      if (window.innerWidth <= 768) {
        fetch("/library/data/thoughts.json")
          .then((response) => response.json())
          .then((thoughts) => {
            const container = document.getElementById("mobile-thoughts");
            if (container) {
              // Show 5 most recent thoughts
              const recentThoughts = thoughts.slice(0, 5);
              container.innerHTML = recentThoughts
                .map(
                  (thought) => `
                  <div class="mobile-thought-item">
                    <p>${thought.text}</p>
                  </div>
                `
                )
                .join("");
            }
          })
          .catch((error) => {
            console.error("Failed to load mobile thoughts:", error);
          });
      }
    </script>
